[workspace]
resolver = "2"
members = ["crates/frolic-core", "crates/frolic"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
frolic-core = { path = "crates/frolic-core" }
glam = "0.29"
rayon = "1.10"

# Bevy is slow in pure debug builds; optimize dependencies and the physics core
# even in dev, keep app code lightly optimized for fast iteration.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.frolic-core]
opt-level = 3

[profile.release]
lto = "thin"
